<style>

<title>Winter Lock In</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one calm 560px column, large page title and date switcher, roomy cards, fixed four-tab bar at the bottom. */
:root{
  --bg:#F3F5F8; --card:#FFFFFF; --ink:#0F172A; --muted:#566173; --faint:#8C96A5; --line:#E1E5EC;
  --accent:#2650D8; --accent-ink:#FFFFFF; --accent-soft:#E7EDFC;
  --good:#0F7B5A; --good-soft:#E1F3EB; --pr:#8A5A0B; --pr-soft:#FBEED3; --bad:#C23B32;
  --hdr1:#1D41BD; --hdr2:#3268EA; --hdr-ink:#FFFFFF; --hdr-muted:rgba(255,255,255,.78); --hdr-btn:rgba(255,255,255,.14); --hdr-line:rgba(255,255,255,.24);
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1018; --card:#141B26; --ink:#EEF2F7; --muted:#A1ACBB; --faint:#6F7B8B; --line:#243041;
  --accent:#7D9BFF; --accent-ink:#0B1018; --accent-soft:#1C2A48;
  --good:#4CC79C; --good-soft:#14322A; --pr:#F0B456; --pr-soft:#3A2C14; --bad:#F07A70; --hdr1:#132654; --hdr2:#1E3C8C; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0B1018; --card:#141B26; --ink:#EEF2F7; --muted:#A1ACBB; --faint:#6F7B8B; --line:#243041;
  --accent:#7D9BFF; --accent-ink:#0B1018; --accent-soft:#1C2A48;
  --good:#4CC79C; --good-soft:#14322A; --pr:#F0B456; --pr-soft:#3A2C14; --bad:#F07A70; --hdr1:#132654; --hdr2:#1E3C8C; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:relative;overflow:hidden;padding-block:22px 24px;margin-bottom:6px;border-radius:0 0 28px 28px;background:linear-gradient(155deg,var(--hdr1) 0%,var(--hdr2) 100%);color:var(--hdr-ink)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--hdr1)}
.flake{position:absolute;right:-34px;top:-30px;width:190px;height:190px;color:#fff;opacity:.12;pointer-events:none}
.top .wrap{position:relative}
.top-row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.app{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--hdr-ink)}
.app svg{width:18px;height:18px;color:var(--hdr-ink)}
.sync{font-size:13px;font-weight:600;color:var(--hdr-muted)}
.sync.err{color:#FFD2CE}
h1{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:8px 0 0;color:var(--hdr-ink)}
.datenav{display:flex;align-items:center;gap:12px;margin-top:18px}
.dn-btn{width:50px;height:50px;flex:none;border-radius:15px;border:1px solid var(--hdr-line);background:var(--hdr-btn);display:grid;place-items:center;color:var(--hdr-ink)}
.dn-btn svg{width:22px;height:22px}
.dn-btn:disabled{opacity:.35;cursor:default}
.dn-mid{flex:1;min-width:0;text-align:center}
.dn-mid b{display:block;font-size:19px;font-weight:700}
.dn-mid span{font-size:15px;color:var(--hdr-muted)}
.top .link{color:var(--hdr-ink);text-decoration:underline;text-underline-offset:3px}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:700}

/* layout */
main{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:18px;padding-block:14px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px;min-width:0}
.card h2{font-size:21px;font-weight:750;letter-spacing:-.01em;margin:0;text-wrap:balance}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.sub{font-size:15px;color:var(--muted);margin:4px 0 0}
.sec{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 4px -2px}
.empty{color:var(--muted);font-size:16px;margin:10px 0 0}
.pill{font-size:15px;font-weight:700;padding:6px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}

/* home */
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.hero-big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.hero-r{text-align:right}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin:18px 0 12px}
.bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
.quote{margin:4px 4px 0;font-size:20px;font-weight:650;line-height:1.35;text-wrap:pretty}
.quote span{display:block;font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.today.done{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.loglist{display:flex;flex-direction:column;margin-top:10px}
.logrow{display:flex;align-items:center;gap:14px;min-height:62px;padding:8px 0;width:100%;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.logrow:first-child{border-top:0}
.tick{width:30px;height:30px;flex:none;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:#fff}
.tick svg{width:17px;height:17px}
.logrow.ok .tick{background:var(--good);border-color:var(--good);color:var(--card)}
.lr-l{flex:1;font-size:18px;font-weight:650}
.lr-v{font-size:16px;color:var(--muted);text-align:right}
.logrow:not(.ok) .lr-v{color:var(--accent);font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:15px;background:var(--line)}
.seg button{height:46px;border:0;border-radius:12px;background:transparent;font-size:16px;font-weight:650;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(15,23,42,.12)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.card .tiles{margin-top:16px}
.card .tile{background:var(--bg);border-color:transparent}
.tile .l{font-size:15px;font-weight:600;color:var(--muted)}
.tile .v{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:6px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tile .v small{font-size:16px;font-weight:650;letter-spacing:0;color:var(--muted);margin-left:5px}
.tile .v .na{font-size:20px;font-weight:650;color:var(--faint);letter-spacing:0}
.backup{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;padding:10px 0 4px}

/* forms */
.q{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.q-label{font-size:18px;font-weight:650}
.yn,.opts3{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts3{grid-template-columns:repeat(3,1fr)}
.yn button,.opts3 button{height:54px;border-radius:15px;border:1.5px solid var(--line);background:var(--card);font-size:17px;font-weight:700;color:var(--muted)}
.yn button.on,.opts3 button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.inwrap{position:relative;display:block;min-width:0}
.inp{display:block;width:100%;min-width:0;height:56px;border-radius:15px;border:1.5px solid var(--line);background:var(--bg);padding:0 16px;font-size:20px;font-weight:650;font-variant-numeric:tabular-nums}
.inp:focus{border-color:var(--accent);outline:none}
.inp::placeholder{color:var(--faint);font-weight:500}
.inwrap .inp{padding-right:62px}
.suf{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:16px;font-weight:600;color:var(--muted);pointer-events:none}
.inp.txt{font-size:17px;font-weight:500}
textarea.inp{height:auto;min-height:110px;padding:14px 16px;font-size:17px;font-weight:500;line-height:1.45;resize:vertical}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:0 18px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);font-size:16px;font-weight:650;cursor:pointer}
.chip:disabled{opacity:.45;cursor:default}
.chip svg{width:16px;height:16px}
.chip.del{border-color:var(--bad);color:var(--bad)}
.btn{height:56px;padding:0 22px;border:0;border-radius:15px;background:var(--accent);color:var(--accent-ink);font-size:17px;font-weight:700;flex:none}
.btn-soft,.btn-ghost{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:56px;padding:10px 16px;border-radius:15px;font-size:17px;font-weight:700;margin-top:16px}
.btn-soft{border:0;background:var(--accent-soft);color:var(--accent)}
.btn-soft span{font-size:14px;font-weight:600;opacity:.85}
.btn-ghost{flex-direction:row;gap:8px;border:1.5px dashed var(--accent);background:transparent;color:var(--accent)}
.btn-ghost svg{width:20px;height:20px}
.addrow{display:flex;gap:10px;margin-top:14px}
.addrow .inp{flex:1}

/* gym */
.exlist{margin-top:8px}
.ex{padding-block:18px;border-top:1px solid var(--line)}
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ex-name{font-size:19px;font-weight:700;display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.ex-last{font-size:15px;color:var(--muted);margin-top:2px}
.badge{font-size:13px;font-weight:800;letter-spacing:.04em;padding:3px 10px;border-radius:999px;background:var(--pr-soft);color:var(--pr)}
.ex .pair{margin-top:12px}
.rm{width:44px;height:44px;flex:none;border:0;border-radius:12px;background:transparent;color:var(--faint);display:grid;place-items:center;margin:-6px -8px 0 0}
.rm:hover{background:var(--bg);color:var(--ink)}
.rm-txt{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:40px;padding:0 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--bad);font-size:15px;font-weight:700}
.rm-txt svg{width:16px;height:16px}
.rm-txt:hover{border-color:var(--bad)}
.rm svg{width:20px;height:20px}
.picker{margin-top:16px;padding:18px;border-radius:16px;background:var(--bg)}
.picker-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.picker-h b{font-size:17px}
.picker details{margin-top:16px}
.picker summary{cursor:pointer;font-weight:700;color:var(--accent);list-style:none}
.picker summary::-webkit-details-marker{display:none}
.picker .grp{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 10px}
.picker .chip{background:var(--card)}
.picker .done-row{display:flex;justify-content:center;margin-top:16px}
.crow{display:flex;align-items:center;gap:16px;padding-block:8px}
.crow+.crow{border-top:1px solid var(--line)}
.crow-l{flex:1;font-size:18px;font-weight:650}
.crow .inwrap{width:150px;flex:none}

/* progress */
.lift-big{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
.lift-head{margin-top:14px}
.lifts{margin-top:8px}
.lift{display:flex;align-items:center;gap:12px;width:100%;padding:14px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.lift .grow{flex:1;min-width:0}
.lift-n{font-size:17px;font-weight:700}
.lift.sel .lift-n{color:var(--accent)}
.lift-s{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.chg{font-size:15px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--good-soft);color:var(--good);white-space:nowrap;font-variant-numeric:tabular-nums}
.chg.flat{background:var(--bg);color:var(--muted)}
.big-r{font-size:26px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.chart{width:100%;margin-top:14px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.c-lab{fill:var(--muted);font-family:var(--font);font-size:13px;font-weight:600}
.c-lab.hl{fill:var(--ink);font-weight:800}
.c-val{fill:var(--ink);font-family:var(--font);font-size:13px;font-weight:700}
.c-grid{stroke:var(--line);stroke-width:1}
.delta{display:inline-block;margin-left:8px;font-size:15px;font-weight:700;color:var(--muted)}
.delta.down{color:var(--good)}
.plist{margin-top:8px}
.prow{display:flex;align-items:center;gap:12px;padding-block:10px;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow span{flex:1;min-width:0;font-size:17px;font-weight:600;overflow-wrap:anywhere}

/* tabs and toast */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding-block:8px 6px}
.tabs button{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border:0;background:none;font-size:13px;font-weight:700;color:var(--faint)}
.tabs button svg{width:26px;height:26px}
.tabs button.on{color:var(--accent)}
.tdot{position:absolute;top:4px;left:calc(50% + 11px);width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--card)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:16px;max-width:calc(100% - 40px);padding:14px 16px 14px 20px;border-radius:16px;background:var(--ink);color:var(--card);font-size:16px;font-weight:600;box-shadow:0 8px 28px rgba(0,0,0,.22)}
.toast button{border:0;background:none;color:var(--card);font-weight:800;text-decoration:underline;padding:4px}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top"><svg class="flake" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" aria-hidden="true"><path d="M50 6v88M12 28l76 44M12 72l76-44"/><path d="M50 18l-9-9M50 18l9-9M50 82l-9 9M50 82l9 9M22 34l-12-3M22 34l-3-12M78 66l12 3M78 66l3 12M22 66l-12 3M22 66l-3 12M78 34l12-3M78 34l3-12"/></svg><div class="wrap">
  <div class="top-row"><span class="app"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>Winter Lock In</span><span class="sync" id="sync" hidden></span></div>
  <h1 id="title">Home</h1>
  <div class="datenav" id="datenav"></div>
</div></header>
<main class="wrap" id="view"></main>

<script>
"use strict";
/* ---------- settings ---------- */
const START='2026-10-26', END='2026-12-24';
const LS='winter-lock-in-v2', LS_OLD='winter-lock-in-v1';
const TYPES=['Push','Pull','Legs'];
const DEFAULT_LIB={
  Push:['Bench Press','Incline Dumbbell Press','Overhead Press','Lateral Raise','Tricep Pushdown','Dips'],
  Pull:['Pull-up','Barbell Row','Lat Pulldown','Seated Cable Row','Face Pull','Bicep Curl'],
  Legs:['Squat','Romanian Deadlift','Leg Press','Leg Curl','Leg Extension','Calf Raise']
};
const QUOTES=['A little every day builds over time.','Consistency beats intensity.','You don\'t need a perfect day. You need a logged one.','Show up, log it, go again tomorrow.','Motivation starts it. Habit finishes it.','One more set. One more page. One more word.','Progress is quiet until suddenly it isn\'t.','Never miss twice.','Be the one who finishes the year strong.','Ten minutes of Dutch beats none.','Rest is part of the plan, not a break from it.','Get 1% better and let the weeks do the maths.','Effort compounds.','What gets tracked gets better.','Lock in now, thank yourself at Christmas.','Boring consistency wins.','Earn the Christmas break.','Do it tired. Do it anyway.','The plan only works if you do.','Today\'s top set is next month\'s warm-up.','Small steps still move you forward.','It\'s never one big leap. It\'s lots of small ones.','Fall in love with the process.','Finish what you started.','Make today a day worth logging.','Nobody regrets the session they did.','Phone down, book up.','Sleep well, train hard, repeat.','Little and often.','Keep the promise you made to yourself.','The scoreboard doesn\'t lie.','Hard days count double.','Discipline is remembering what you want.','Win the morning, win the day.','You\'re building a habit, not chasing a feeling.','The streak is the reward.','Small wins are still wins.','Do the next right thing.','Start before you feel ready.','You are what you repeat.','Good days are built, not found.','One good day at a time.','Earn your sleep.','Late nights cost early mornings.','Practice makes progress.','Momentum is built daily.','Hard work is a habit too.','Done is better than perfect.','Own the day.','Be consistent long enough to surprise yourself.','Your future self is watching.','Every rep counts. Every word counts.','A bit of Dutch a day keeps the rust away.','Keep going. You\'re closer than you think.','Nothing changes if nothing changes.','Win the week.','A quiet day of work is still progress.','Bit by bit, it all adds up.','Strength is built in the boring reps.','Turn up the effort, turn down the noise.','Leave the day better than you found it.','Motivation fades. Routine stays.','Trust the process, log the process.','Stack the days.','Discipline now, a proper Christmas later.','Don\'t count the days. Make the days count.','The work is the shortcut.','Be proud of the small stuff.'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

/* ---------- helpers ---------- */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const P=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const diffD=(a,b)=>Math.round((P(b)-P(a))/864e5);
const monday=s=>{const d=P(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const todayISO=()=>iso(new Date());
const fd=s=>{const d=P(s);return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`};
const fds=s=>{const d=P(s);return `${d.getDate()} ${MON[d.getMonth()]}`};
const r1=v=>Math.round(v*10)/10;
const num=v=>(v===null||v===undefined||v==='')?null:(isFinite(+v)?+v:null);
const sum=a=>a.reduce((x,y)=>x+(+y||0),0);
const clone=o=>JSON.parse(JSON.stringify(o));
const fmtMin=m=>{m=Math.round(m||0);if(m<60)return m+'m';const h=Math.floor(m/60),mm=m%60;return mm?`${h}h ${mm}m`:`${h}h`};
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;
function daysRange(a,b){const out=[];for(let s=a;s<=b;s=addD(s,1))out.push(s);return out}
const ALL_DAYS=daysRange(START,END), TOTAL=ALL_DAYS.length;
const inRange=s=>s>=START&&s<=END;
const maxDate=()=>{const t=todayISO();return t<START?START:(t>END?END:t)};
const clampD=s=>s<START?START:(s>maxDate()?maxDate():s);
const elapsedDays=days=>days.filter(s=>s<=todayISO()).length;
const weekOf=s=>daysRange(monday(s),addD(monday(s),6));
const $=id=>document.getElementById(id);

};

/* ---------- data ---------- */
const S={days:{},lib:null,ui:{tab:'home',sel:null,range:'week',picker:false,pickEdit:false,othersOpen:false,lift:null}};
const lib=()=>S.lib||DEFAULT_LIB;
function blank(date){return{v:2,date,gym:{went:null,type:'',ex:[]},football:null,cardio:{run:null,cycle:null,swim:null},dutch:{vocab:null,bente:null},gen:{screen:null,read:null,stretch:null,pods:[],learn:''}}}
const yn3=v=>v===true?true:v===false?false:null;
/* Converts an entry from the first version of the app: keeps the heaviest set per exercise and totals the cardio. */
function fromV1(d){
  const g=d.gym||{};
  const ex=(g.exercises||[]).map(e=>{const sets=(e.sets||[]).filter(s=>+s.r>0);if(!sets.length)return{name:e.name,w:null,r:null};
    let b=sets[0];for(const s of sets){const w=+s.w||0,bw=+b.w||0;if(w>bw||(w===bw&&+s.r>+b.r))b=s}return{name:e.name,w:num(b.w),r:num(b.r)}});
  const dist=k=>{const v=sum((d.cardio||[]).filter(c=>c.type===k).map(c=>c.dist));return v>0?v:null};
  const gen=d.general||{};
  return{v:2,gym:{went:yn3(g.went),type:g.type||'',ex},football:Array.isArray(d.football)&&d.football.length?true:null,
    cardio:{run:dist('run'),cycle:dist('cycle'),swim:dist('swim')!=null?Math.round(dist('swim')*1000):null},
    dutch:{vocab:yn3(d.dutch&&d.dutch.vocab),bente:num(d.dutch&&d.dutch.bente)||null},
    gen:{screen:num(gen.screen),read:yn3(gen.read),stretch:yn3(d.stretched),pods:(gen.podcasts||[]).map(p=>p&&p.title).filter(Boolean),learn:gen.researchNotes||''}}}
function norm(d,date){
  if(!d||typeof d!=='object')return blank(date);
  if(d.v!==2)d=fromV1(d);
  const g=d.gym||{},c=d.cardio||{},du=d.dutch||{},ge=d.gen||{};
  return{v:2,date,
    gym:{went:yn3(g.went),type:TYPES.includes(g.type)?g.type:'',ex:(Array.isArray(g.ex)?g.ex:[]).filter(e=>e&&e.name).map(e=>({name:String(e.name),w:num(e.w),r:num(e.r)}))},
    football:yn3(d.football),
    cardio:{run:num(c.run),cycle:num(c.cycle),swim:num(c.swim)},
    dutch:{vocab:yn3(du.vocab),bente:num(du.bente)},
    gen:{screen:num(ge.screen),read:yn3(ge.read),stretch:yn3(ge.stretch),pods:(Array.isArray(ge.pods)?ge.pods:[]).filter(p=>typeof p==='string'&&p),learn:typeof ge.learn==='string'?ge.learn:''}}}
const getDay=s=>S.days[s]||blank(s);
const day=s=>S.days[s]||(S.days[s]=blank(s));
const sortedDates=()=>Object.keys(S.days).sort();

/* ---------- saving ---------- */
let col=null,lsT=null;
const pending=new Set(),writing=new Map(),timers=new Map();
function writeLocal(){try{localStorage.setItem(LS,JSON.stringify({v:2,days:S.days,lib:S.lib}))}catch(e){}}
function saveLocal(){clearTimeout(lsT);lsT=setTimeout(writeLocal,200)}
addEventListener('pagehide',writeLocal);
document.addEventListener('visibilitychange',()=>{if(document.hidden)writeLocal()});
function loadLocal(){
  try{const j=JSON.parse(localStorage.getItem(LS)||'null');
    if(j){for(const k in j.days||{})S.days[k]=norm(j.days[k],k);S.lib=j.lib||null;return}
    const o=JSON.parse(localStorage.getItem(LS_OLD)||'null');
    if(o){for(const k in o.days||{})S.days[k]=norm(o.days[k],k);S.lib=o.lib||null;writeLocal()}
  }catch(e){}}
function setSync(st){const el=$('sync');if(!el)return;if(st==='local'){el.hidden=true;return}
  el.hidden=false;el.className='sync'+(st==='err'?' err':'');el.textContent={ok:'Synced',busy:'Saving…',err:'Not saved yet'}[st]}
function queue(id,body){saveLocal();if(!col)return;pending.add(id);setSync('busy');
  clearTimeout(timers.get(id));timers.set(id,setTimeout(()=>flush(id,body),700))}
function flush(id,body){timers.delete(id);
  const prev=writing.get(id)||Promise.resolve();
  const p=prev.then(async()=>{pending.delete(id);
    try{await col.doc(id).set(body())}catch(e){
      if(e&&e.code==='quota_exceeded'){setSync('err');toast('Storage is full, so this change was not saved.');return}
      try{await new Promise(r=>setTimeout(r,700+Math.random()*900));await col.doc(id).set(body())}catch(e2){setSync('err')}}});
  writing.set(id,p);
  p.then(()=>{if(writing.get(id)===p)writing.delete(id);if(!pending.size&&!writing.size&&!$('sync').classList.contains('err'))setSync('ok')})}
const saveDay=(s=S.ui.sel)=>queue('d-'+s,()=>S.days[s]||blank(s));
const saveLib=()=>queue('library',()=>({lib:S.lib}));
function applyDoc(id,data){
  if(id.startsWith('d-')){const s=id.slice(2);if(data)S.days[s]=norm(data,s);else delete S.days[s]}
  else if(id==='library')S.lib=data&&data.lib?clone(data.lib):null}
async function initCloud(){
  if(!IN_CLAUDE){setSync('local');return}
  try{
    const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user){setSync('local');return}
    const uid=await user.id();if(!uid){setSync('local');return}
    col=db.collection('data/users/'+uid);
    let settled=false;
    col.onSnapshot(snap=>{
      if(!settled){
        if(snap.metadata.fromCache&&snap.empty)return;
        settled=true;
        if(snap.empty){setSync('ok');for(const d in S.days)saveDay(d);if(S.lib)saveLib();return}
      }
      let changed=false;
      for(const ch of snap.docChanges()){const id=ch.doc.id;
        if(pending.has(id)||writing.has(id)||ch.doc.metadata.hasPendingWrites)continue;
        applyDoc(id,ch.type==='removed'?null:ch.doc.data());changed=true}
      if(!pending.size&&!writing.size)setSync('ok');
      if(changed){saveLocal();softRender()}
    },()=>setSync('err'));
  }catch(e){setSync('local')}}

/* ---------- what counts ---------- */
const hasSet=e=>num(e.r)>0;
const gymDone=g=>g.went===false||(g.went===true&&!!g.type&&g.ex.some(hasSet));
function logItems(d){const g=d.gym,n=g.ex.filter(hasSet).length;return[
  {label:'Gym',tab:'fitness',ok:gymDone(g),val:g.went===false?'Rest day':`${g.type} · ${plural(n,'exercise')}`},
  {label:'Football',tab:'fitness',ok:d.football!=null,val:d.football?'Played':'No'},
  {label:'Dutch',tab:'dutch',ok:d.dutch.vocab!=null,val:(d.dutch.vocab?'Vocab done':'No vocab')+(+d.dutch.bente?` · ${fmtMin(d.dutch.bente)}`:'')},
  {label:'Screen time',tab:'general',ok:d.gen.screen!=null,val:fmtMin(d.gen.screen)},
  {label:'Reading',tab:'general',ok:d.gen.read!=null,val:d.gen.read?'Read':'Didn\'t read'},
  {label:'Stretching',tab:'general',ok:d.gen.stretch!=null,val:d.gen.stretch?'Stretched':'No stretch'}]}
const isComplete=d=>logItems(d).every(i=>i.ok);

function stats(days){
  const st={gym:0,football:0,run:0,cycle:0,swim:0,km:0,bente:0,vocab:0,screenAvg:null,read:0,stretch:0,pods:0,learn:0,prs:0};const scr=[];
  for(const s of days){const d=getDay(s);
    if(d.gym.went===true)st.gym++;if(d.football===true)st.football++;
    st.run+=+d.cardio.run||0;st.cycle+=+d.cardio.cycle||0;st.swim+=+d.cardio.swim||0;
    st.bente+=+d.dutch.bente||0;if(d.dutch.vocab===true)st.vocab++;
    if(d.gen.screen!=null)scr.push(+d.gen.screen);if(d.gen.read===true)st.read++;if(d.gen.stretch===true)st.stretch++;
    st.pods+=d.gen.pods.length;if(d.gen.learn.trim())st.learn++;
    if(d.gym.went===true)st.prs+=d.gym.ex.filter(e=>isPR(e,s)).length}
  st.km=st.run+st.cycle+st.swim/1000;st.screenAvg=scr.length?sum(scr)/scr.length:null;return st}

/* ---------- lifts ---------- */
const better=(a,b)=>{const aw=+a.w||0,bw=+b.w||0;return aw>bw||(aw===bw&&(+a.r||0)>(+b.r||0))};
const setTxt=x=>+x.w>0?`${r1(+x.w)} kg × ${x.r}`:`${x.r} reps`;
function allEntries(name){const out=[];for(const s of sortedDates()){const g=S.days[s].gym;if(g.went!==true)continue;const e=g.ex.find(x=>x.name===name);if(e&&hasSet(e))out.push({date:s,w:num(e.w),r:num(e.r)})}return out}
const hist=name=>allEntries(name).filter(x=>inRange(x.date));
const lastEx=(name,before)=>{const h=allEntries(name).filter(x=>x.date<before);return h[h.length-1]||null};
function isPR(e,date){if(!hasSet(e))return false;const prev=allEntries(e.name).filter(x=>x.date<date);return prev.length>0&&prev.every(p=>better(e,p))}
function liftNames(){const m=new Map();for(const s of ALL_DAYS){const d=S.days[s];if(!d||d.gym.went!==true)continue;for(const e of d.gym.ex)if(hasSet(e))m.set(e.name,s)}
  return[...m.entries()].sort((a,b)=>a[1]<b[1]?1:a[1]>b[1]?-1:a[0].localeCompare(b[0])).map(x=>x[0])}
function lastSession(type,before){const ds=sortedDates().filter(s=>s<before);for(let i=ds.length-1;i>=0;i--){const g=S.days[ds[i]].gym;if(g.went===true&&g.type===type&&g.ex.some(hasSet))return{date:ds[i],ex:g.ex.filter(hasSet)}}return null}

/* ---------- charts ---------- */
const CH=[];
const chart=spec=>`<div class="chart" data-c="${CH.push(spec)-1}"></div>`;
function rTop(x,y,w,h,r){r=Math.min(r,w/2,h);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function barSvg(s,W){
  const H=176,T=28,B=30,ih=H-T-B,n=s.values.length,band=W/n,bw=Math.min(36,band*.58),mx=Math.max(0,...s.values);let g='';
  s.values.forEach((v,i)=>{const cx=band*i+band/2;
    if(v>0){const h=Math.max(6,v/mx*ih),y=T+ih-h;g+=`<path d="${rTop(cx-bw/2,y,bw,h,8)}" fill="var(--accent)"/>`;const lab=s.fmt(v);if(lab)g+=`<text class="c-val" x="${cx}" y="${y-9}" text-anchor="middle">${esc(lab)}</text>`}
    else g+=`<rect x="${cx-bw/2}" y="${T+ih-4}" width="${bw}" height="4" rx="2" fill="var(--line)"/>`;
    g+=`<text class="c-lab${s.hl===i?' hl':''}" x="${cx}" y="${H-7}" text-anchor="middle">${esc(s.labels[i])}</text>`});
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(s.title)}">${g}</svg>`}
function lineSvg(s,W){
  const H=196,T=36,B=32,ih=H-T-B,n=s.values.length,v=s.values;
  let lo=Math.min(...v),hi=Math.max(...v);if(lo===hi){lo-=1;hi+=1}const padv=(hi-lo)*.18;lo-=padv;hi+=padv;
  const x=i=>n===1?W/2:20+(W-40)*i/(n-1),y=val=>T+ih-(val-lo)/(hi-lo)*ih;
  let g=`<line class="c-grid" x1="0" x2="${W}" y1="${T+ih+8}" y2="${T+ih+8}"/>`;
  if(n>1){const pts=v.map((val,i)=>`${r1(x(i))},${r1(y(val))}`);
    g+=`<path d="M${x(0)},${T+ih+8}L${pts.join('L')}L${x(n-1)},${T+ih+8}Z" fill="var(--accent)" fill-opacity=".1"/>`;
    g+=`<path d="M${pts.join('L')}" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`}
  v.forEach((val,i)=>{g+=`<circle cx="${x(i)}" cy="${y(val)}" r="${i===n-1?6.5:4.5}" fill="var(--accent)" stroke="var(--card)" stroke-width="2.5"/>`});
  const lab=(i,a)=>`<text class="c-val" x="${x(i)+(a==='start'?-6:a==='end'?6:0)}" y="${y(v[i])-14}" text-anchor="${a}">${esc(s.fmt(v[i]))}</text>`;
  const dl=(i,a)=>`<text class="c-lab" x="${x(i)+(a==='start'?-6:a==='end'?6:0)}" y="${H-6}" text-anchor="${a}">${esc(s.labels[i])}</text>`;
  if(n===1)g+=lab(0,'middle')+dl(0,'middle');else g+=lab(0,'start')+lab(n-1,'end')+dl(0,'start')+dl(n-1,'end');
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(s.title)}">${g}</svg>`}
function drawCharts(){document.querySelectorAll('.chart[data-c]').forEach(el=>{const s=CH[+el.dataset.c];if(!s)return;const W=Math.max(260,Math.round(el.clientWidth||320));el.innerHTML=s.type==='line'?lineSvg(s,W):barSvg(s,W)})}

/* ---------- pieces ---------- */
function tile(label,value,unit){const v=value==null?'<span class="na">None yet</span>':`${esc(value)}${unit?`<small>${esc(unit)}</small>`:''}`;return `<div class="tile"><div class="l">${label}</div><div class="v">${v}</div></div>`}
function yn(path,val,label,yes='Yes',no='No'){return `<div class="q"><div class="q-label">${label}</div><div class="yn" role="group" aria-label="${esc(label)}">
  <button class="${val===true?'on':''}" data-a="yn" data-v="${path}:1" aria-pressed="${val===true}">${yes}</button><button class="${val===false?'on':''}" data-a="yn" data-v="${path}:0" aria-pressed="${val===false}">${no}</button></div></div>`}
const numInput=(id,bind,val,suf,attrs='',ph='0')=>`<span class="inwrap"><input class="inp" type="number" id="${id}" data-b="${bind}" data-t="num" value="${val==null?'':esc(val)}" placeholder="${ph}" min="0" ${attrs}><span class="suf">${suf}</span></span>`;
const quoteOfDay=()=>{const i=diffD(START,todayISO());return QUOTES[((i%QUOTES.length)+QUOTES.length)%QUOTES.length]};

/* ---------- home ---------- */
function viewHome(){
  const t=todayISO(),pre=t<START,over=t>END,sel=S.ui.sel,d=getDay(sel);
  const dayN=Math.min(TOTAL,diffD(START,t)+1),left=Math.max(0,diffD(t,END)+1);
  const soFar=ALL_DAYS.filter(s=>s<=t),locked=soFar.filter(s=>isComplete(getDay(s))).length;
  const items=logItems(d),done=items.filter(i=>i.ok).length,all=done===items.length;
  const days=S.ui.range==='week'?weekOf(sel).filter(inRange):ALL_DAYS,st=stats(days);
  const hero=pre
    ?`<div class="hero-big">${diffD(t,START)===1?'Starts tomorrow':'Starts 26 Oct'}</div><p class="sub">${TOTAL} days, 26 Oct to 24 Dec</p><div class="bar"><i style="width:0"></i></div>`
    :over?`<div class="hero-big">Challenge complete</div><p class="sub">${locked} of ${TOTAL} days fully logged</p><div class="bar"><i style="width:100%"></i></div>`
    :`<div class="hero-row"><div><div class="hero-big num">Day ${dayN}</div><p class="sub">of ${TOTAL}</p></div><div class="hero-r"><div class="hero-big num">${left}</div><p class="sub">${left===1?'day':'days'} left</p></div></div>
      <div class="bar"><i style="width:${Math.round(dayN/TOTAL*100)}%"></i></div><p class="sub">${locked} of ${soFar.length} ${soFar.length===1?'day':'days'} fully logged</p>`;
  return `<div class="stack">
    <section class="card">${hero}</section>
    <p class="quote"><span>Quote of the day</span>${esc(quoteOfDay())}</p>
    <section class="card today${all?' done':''}">
      <div class="card-h"><h2>${sel===t?'Today':fd(sel)}</h2><span class="pill${all?' good':''}">${all?'All logged':`${done} of ${items.length} logged`}</span></div>
      <div class="loglist">${items.map(i=>`<button class="logrow${i.ok?' ok':''}" data-a="tab" data-v="${i.tab}"><span class="tick">${i.ok?IC.check:''}</span><span class="lr-l">${i.label}</span><span class="lr-v">${i.ok?esc(i.val):'To log'}</span></button>`).join('')}</div>
    </section>
    <div class="seg" role="group" aria-label="Show totals for"><button class="${S.ui.range==='week'?'on':''}" data-a="range" data-v="week" aria-pressed="${S.ui.range==='week'}">This week</button><button class="${S.ui.range==='all'?'on':''}" data-a="range" data-v="all" aria-pressed="${S.ui.range==='all'}">Whole challenge</button></div>
    <div class="tiles">
      ${tile('Gym sessions',st.gym)}${tile('Football',st.football)}
      ${tile('Distance',r1(st.km),'km')}${tile('Dutch',fmtMin(st.bente))}
      ${tile('Avg screen time',st.screenAvg==null?null:fmtMin(st.screenAvg))}${tile('Nights read',st.read)}
    </div>
    ${IN_CLAUDE?'':`<div class="backup"><p class="sub">Your entries are saved on this device.</p><div class="chips"><button class="chip" data-a="backup">Download backup</button><label class="chip" for="restore">Restore backup</label></div></div>`}
  </div>`}

/* ---------- fitness ---------- */
function viewFitness(){
  const sel=S.ui.sel,d=getDay(sel),g=d.gym;
  let gym=`<section class="card"><h2>Gym</h2>${yn('gym.went',g.went,'Did you train today?','Yes','Rest day')}`;
  if(g.went===true){
    gym+=`<div class="q"><div class="q-label">Session</div><div class="opts3" role="group" aria-label="Session">${TYPES.map(T=>`<button class="${g.type===T?'on':''}" data-a="gymType" data-v="${T}" aria-pressed="${g.type===T}">${T}</button>`).join('')}</div></div>`;
    if(g.type){
      if(g.ex.length)gym+=`<div class="q"><div class="q-label">Heaviest set for each exercise</div></div><div class="exlist">${g.ex.map((e,i)=>exRow(e,i,sel)).join('')}</div>`;
      const last=!g.ex.length?lastSession(g.type,sel):null;
      if(last)gym+=`<button class="btn-soft" data-a="loadLast">Repeat last ${g.type} session<span>${fds(last.date)} · ${plural(last.ex.length,'exercise')}</span></button>`;
      gym+=S.ui.picker?picker(g):`<button class="btn-ghost" data-a="picker">${IC.plus}Add exercise</button>`;
    }
  }
  gym+='</section>';
  const foot=`<section class="card"><h2>Football</h2>${yn('football',d.football,'Did you play today?')}</section>`;
  const cardio=`<section class="card"><h2>Running, cycling and swimming</h2><div style="margin-top:10px">
    ${[['run','Run','km','0.1'],['cycle','Cycle','km','0.1'],['swim','Swim','m','25']].map(([k,l,u,st])=>`<label class="crow" for="c-${k}"><span class="crow-l">${l}</span>${numInput('c-'+k,'cardio.'+k,d.cardio[k],u,`inputmode="decimal" step="${st}"`,'')}</label>`).join('')}</div></section>`;
  return `<div class="stack">${gym}${foot}${cardio}<h3 class="sec">Progress since 26 Oct</h3>${liftsCard()}${fitTotals()}</div>`}
function exRow(e,i,sel){
  const last=lastEx(e.name,sel),pr=isPR(e,sel);
  return `<div class="ex"><div class="ex-top"><div style="min-width:0"><div class="ex-name">${esc(e.name)}${pr?'<span class="badge">PR</span>':''}</div><div class="ex-last">${last?`Last time ${setTxt(last)}`:'First time logged'}</div></div><button class="rm-txt" data-a="rmEx" data-v="${i}" aria-label="Delete ${esc(e.name)} from this session">${IC.x}Delete</button></div>
    <div class="pair"><label for="ex-${i}-w"><span class="vh">${esc(e.name)} weight</span>${numInput(`ex-${i}-w`,`gym.ex.${i}.w`,e.w,'kg','inputmode="decimal" step="0.5"')}</label><label for="ex-${i}-r"><span class="vh">${esc(e.name)} reps</span>${numInput(`ex-${i}-r`,`gym.ex.${i}.r`,e.r,'reps','inputmode="numeric" step="1"')}</label></div></div>`}
function picker(g){
  const used=new Set(g.ex.map(e=>e.name)),L=lib(),ed=S.ui.pickEdit,others=TYPES.filter(T=>T!==g.type);
  const chips=T=>L[T].length?`<div class="chips">${L[T].map((n,i)=>ed
      ?`<button class="chip del" data-a="libRm" data-v="${T}:${i}" aria-label="Delete ${esc(n)} from your list">${esc(n)}${IC.x}</button>`
      :`<button class="chip" data-a="addEx" data-v="${esc(n)}" ${used.has(n)?'disabled':''}>${esc(n)}</button>`).join('')}</div>`:'<p class="sub">Nothing in this list.</p>';
  return `<div class="picker" id="picker"><div class="picker-h"><b>${ed?'Tap an exercise to delete it':`${g.type} exercises`}</b><button class="link" data-a="pickEdit">${ed?'Done':'Delete from list'}</button></div>
    ${chips(g.type)}
    <details id="othersdet" ${S.ui.othersOpen?'open':''}><summary>Other exercises</summary>${others.map(T=>`<div class="grp">${T}</div>${chips(T)}`).join('')}</details>
    ${ed?'':`<div class="addrow"><input class="inp txt" type="text" id="exNew" placeholder="New exercise" aria-label="New exercise name"><button class="btn" data-a="addNewEx">Add</button></div>`}
    <div class="done-row"><button class="link" data-a="pickClose">Close</button></div></div>`}
function liftsCard(){
  const names=liftNames();
  if(!names.length)return `<section class="card"><h2>Lifts</h2><p class="empty">Your heaviest sets show here after your first session.</p></section>`;
  if(!S.ui.lift||!names.includes(S.ui.lift))S.ui.lift=names[0];
  const h=hist(S.ui.lift),cur=h[h.length-1],bw=!(+cur.w>0);
  const fmt=v=>bw?`${v} reps`:`${r1(v)} kg`;
  return `<section class="card"><h2>Lifts</h2>
    <div class="lift-head"><p class="sub" style="margin:0">${esc(S.ui.lift)}</p><div class="lift-big">${setTxt(cur)}</div></div>
    ${chart({type:'line',title:`${S.ui.lift} heaviest set over time`,labels:h.map(x=>fds(x.date)),values:h.map(x=>bw?+x.r:+x.w||0),fmt})}
    <div class="lifts">${names.map(n=>{const x=hist(n),a=x[0],b=x[x.length-1],bwn=!(+b.w>0),dv=bwn?(+b.r-+a.r):r1((+b.w||0)-(+a.w||0));
      const dr=+b.r-+a.r,up=dv>0||(dv===0&&!bwn&&dr>0);
      const lab=dv!==0?`${dv>0?'+':''}${dv}${bwn?(Math.abs(dv)===1?' rep':' reps'):' kg'}`:(!bwn&&dr!==0?`${dr>0?'+':''}${dr} ${Math.abs(dr)===1?'rep':'reps'}`:'Same');
      return `<button class="lift${n===S.ui.lift?' sel':''}" data-a="lift" data-v="${esc(n)}" aria-pressed="${n===S.ui.lift}"><span class="grow"><span class="lift-n" style="display:block">${esc(n)}</span><span class="lift-s">${setTxt(b)}</span></span><span class="chg${up?'':' flat'}">${lab}</span></button>`}).join('')}</div></section>`}
function fitTotals(){const st=stats(ALL_DAYS);
  return `<div class="tiles">${tile('Gym sessions',st.gym)}${tile('Football',st.football)}${tile('Run',r1(st.run),'km')}${tile('Cycle',r1(st.cycle),'km')}${tile('Swim',Math.round(st.swim),'m')}${tile('PRs',st.prs)}</div>`}

/* ---------- dutch ---------- */
function viewDutch(){
  const sel=S.ui.sel,d=getDay(sel),wk=weekOf(sel),wst=stats(wk.filter(inRange)),st=stats(ALL_DAYS);
  return `<div class="stack">
    <section class="card"><h2>Dutch</h2>${yn('dutch.vocab',d.dutch.vocab,'Did you review vocab?')}
      <div class="q"><label class="q-label" for="bente">Time on Bente</label>${numInput('bente','dutch.bente',d.dutch.bente,'min','inputmode="numeric" step="1"')}
      <div class="chips">${[5,10,15].map(m=>`<button class="chip" data-a="bente" data-v="${m}">+${m} min</button>`).join('')}</div></div></section>
    <h3 class="sec">Progress</h3>
    <section class="card"><div class="card-h"><h2>This week</h2><span class="big-r">${fmtMin(wst.bente)}</span></div>
      ${chart({type:'bar',title:'Minutes on Bente each day this week',labels:wk.map(s=>DOW[P(s).getDay()]),values:wk.map(s=>inRange(s)?(+getDay(s).dutch.bente||0):0),fmt:v=>String(v),hl:wk.indexOf(sel)})}
      <p class="sub">Vocab reviewed on ${plural(wst.vocab,'day')} this week</p></section>
    <div class="tiles">${tile('Total on Bente',fmtMin(st.bente))}${tile('Vocab days',st.vocab,`of ${elapsedDays(ALL_DAYS)}`)}</div>
  </div>`}

/* ---------- general ---------- */
function viewGeneral(){
  const sel=S.ui.sel,d=getDay(sel),g=d.gen,wk=weekOf(sel),wst=stats(wk.filter(inRange)),st=stats(ALL_DAYS);
  const prevWk=weekOf(addD(monday(sel),-7)).filter(inRange),pst=prevWk.length?stats(prevWk):null;
  let delta='';if(pst&&pst.screenAvg!=null&&wst.screenAvg!=null){const dv=wst.screenAvg-pst.screenAvg;delta=Math.abs(dv)<1?'<span class="delta">Same as last week</span>':`<span class="delta${dv<0?' down':''}">${dv<0?'▼':'▲'} ${fmtMin(Math.abs(dv))} vs last week</span>`}
  const sh=g.screen==null?'':Math.floor(g.screen/60),sm=g.screen==null?'':g.screen%60;
  return `<div class="stack">
    <section class="card"><h2>Screen time</h2><div class="pair" style="margin-top:16px">
      <label for="scr-h"><span class="vh">Hours</span><span class="inwrap"><input class="inp" type="number" id="scr-h" data-b="gen.screen" data-t="hm" inputmode="numeric" min="0" value="${sh}" placeholder="0"><span class="suf">hours</span></span></label>
      <label for="scr-m"><span class="vh">Minutes</span><span class="inwrap"><input class="inp" type="number" id="scr-m" data-b="gen.screen" data-t="hm" inputmode="numeric" min="0" max="59" value="${sm}" placeholder="0"><span class="suf">min</span></span></label></div></section>
    <section class="card"><h2>Reading</h2>${yn('gen.read',g.read,'Did you read before bed?')}</section>
    <section class="card"><h2>Stretching</h2>${yn('gen.stretch',g.stretch,'Did you stretch today?')}</section>
    <section class="card"><h2>Podcasts</h2>
      ${g.pods.length?`<div class="plist">${g.pods.map((p,i)=>`<div class="prow"><span>${esc(p)}</span><button class="rm" data-a="rmPod" data-v="${i}" aria-label="Remove ${esc(p)}">${IC.x}</button></div>`).join('')}</div>`:''}
      <div class="addrow"><input class="inp txt" type="text" id="podNew" placeholder="Podcast or episode" aria-label="Podcast or episode"><button class="btn" data-a="addPod">Add</button></div></section>
    <section class="card"><h2>Extra learning</h2><label class="vh" for="learn">Extra learning</label><textarea class="inp" id="learn" data-b="gen.learn" data-t="text" placeholder="What did you learn today?" style="margin-top:16px">${esc(g.learn)}</textarea></section>
    <h3 class="sec">Progress</h3>
    <section class="card"><h2>Screen time this week</h2>
      <div style="margin-top:10px"><span class="lift-big">${wst.screenAvg==null?'None yet':fmtMin(wst.screenAvg)}</span>${wst.screenAvg==null?'':'<span class="sub" style="margin-left:8px">a day</span>'}</div>${delta?`<div style="margin-top:2px">${delta.replace('class="delta','style="margin-left:0" class="delta')}</div>`:''}
      ${chart({type:'bar',title:'Hours of screen time each day this week',labels:wk.map(s=>DOW[P(s).getDay()]),values:wk.map(s=>inRange(s)&&getDay(s).gen.screen!=null?r1(getDay(s).gen.screen/60):0),fmt:v=>`${v}h`,hl:wk.indexOf(sel)})}</section>
    <div class="tiles">${tile('Nights read',st.read,`of ${elapsedDays(ALL_DAYS)}`)}${tile('Stretch days',st.stretch,`of ${elapsedDays(ALL_DAYS)}`)}${tile('Podcasts',st.pods)}${tile('Learning days',st.learn)}</div>
  </div>`}

/* ---------- render ---------- */
const TABS=[['home','Home'],['fitness','Fitness'],['dutch','Dutch'],['general','General']];
const VIEWS={home:viewHome,fitness:viewFitness,dutch:viewDutch,general:viewGeneral};
let needRender=false;
function render(){
  const ae=document.activeElement,fid=ae&&ae.id;let caret=null;try{caret=ae&&ae.selectionStart}catch(e){}
  CH.length=0;S.ui.sel=clampD(S.ui.sel||maxDate());
  const tab=S.ui.tab,sel=S.ui.sel,t=todayISO(),mx=maxDate(),isT=sel===t;
  const need=new Set(logItems(getDay(sel)).filter(i=>!i.ok).map(i=>i.tab));
  $('title').textContent=TABS.find(x=>x[0]===tab)[1];
  $('datenav').innerHTML=`<button class="dn-btn" data-a="date" data-v="-1" ${sel<=START?'disabled':''} aria-label="Previous day">${IC.left}</button>
    <div class="dn-mid"><b>${isT?'Today':fd(sel)}</b><span>${t<START?'Day 1 · starts tomorrow':isT?fd(sel):`Day ${diffD(START,sel)+1} of ${TOTAL}`}${sel!==mx?` · <button class="link" data-a="date" data-v="today">Back to today</button>`:''}</span></div>
    <button class="dn-btn" data-a="date" data-v="1" ${sel>=mx?'disabled':''} aria-label="Next day">${IC.right}</button>`;
  $('tabs').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" data-a="tab" data-v="${k}" aria-current="${k===tab?'page':'false'}">${IC[k]}<span>${l}</span>${need.has(k)?'<i class="tdot" aria-label="Still to log"></i>':''}</button>`).join('');
  $('view').innerHTML=VIEWS[tab]();
  drawCharts();
  if(fid){const el=$(fid);if(el&&el!==document.body){el.focus({preventScroll:true});if(caret!=null){try{el.setSelectionRange(caret,caret)}catch(e){}}}}
  needRender=false}
/* Re-render after the current tap finishes, so a button pressed straight after typing still gets its click. */
let ptrDown=false,rq=null;
function requestRender(){needRender=true;if(ptrDown)return;clearTimeout(rq);rq=setTimeout(()=>{if(needRender&&!ptrDown)render()},0)}
function softRender(){const ae=document.activeElement;if(ae&&ae.matches&&ae.matches('input,textarea')&&$('view').contains(ae)){needRender=true;return}requestRender()}
document.addEventListener('pointerdown',()=>{ptrDown=true},true);
document.addEventListener('pointerup',()=>{ptrDown=false;if(needRender){clearTimeout(rq);rq=setTimeout(()=>{if(needRender)softRender()},30)}},true);
document.addEventListener('pointercancel',()=>{ptrDown=false},true);
document.addEventListener('focusout',()=>setTimeout(()=>{if(needRender)softRender()},0));
document.addEventListener('toggle',e=>{if(e.target.id==='othersdet')S.ui.othersOpen=e.target.open},true);

/* ---------- inputs ---------- */
function setPath(obj,path,val){const ks=path.split('.');let o=obj;for(let i=0;i<ks.length-1;i++){o=o[ks[i]];if(o==null)return}o[ks[ks.length-1]]=val}
const getPath=(o,p)=>p.split('.').reduce((a,k)=>a==null?a:a[k],o);
function applyBind(el){
  const s=S.ui.sel,d=day(s),t=el.dataset.t;let val;
  if(t==='num')val=el.value===''?null:Math.max(0,+el.value);
  else if(t==='hm'){const h=$('scr-h').value,m=$('scr-m').value;val=h===''&&m===''?null:Math.max(0,(+h||0)*60+(+m||0))}
  else val=el.value;
  setPath(d,el.dataset.b,val);saveDay(s)}
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.b)applyBind(el)});
document.addEventListener('change',e=>{const el=e.target;
  if(el.id==='restore'){restoreFrom(el);return}
  if(el.dataset&&el.dataset.b){applyBind(el);requestRender()}});
document.addEventListener('keydown',e=>{if(e.key!=='Enter')return;
  if(e.target.id==='exNew'){e.preventDefault();A.addNewEx()}
  if(e.target.id==='podNew'){e.preventDefault();A.addPod()}});

/* ---------- actions ---------- */
let undo=null,toastT=null;
function toast(msg,canUndo){const h=$('toast-host');h.innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${canUndo?'<button data-a="undo">Undo</button>':''}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>{h.innerHTML='';undo=null},6000)}
function snapUndo(){const s=S.ui.sel,d=JSON.stringify(S.days[s]||blank(s)),l=JSON.stringify(S.lib);
  undo=()=>{S.days[s]=norm(JSON.parse(d),s);saveDay(s);if(JSON.stringify(S.lib)!==l){S.lib=JSON.parse(l);saveLib()}}}
function setTab(t){S.ui.tab=t;S.ui.picker=false;S.ui.pickEdit=false;try{history.replaceState(null,'','#'+t)}catch(e){}render();scrollTo({top:0})}
function addExercise(n){const d=day(S.ui.sel);if(!n||d.gym.ex.some(e=>e.name===n))return;
  const last=lastEx(n,S.ui.sel);d.gym.ex.push({name:n,w:last?last.w:null,r:last?last.r:null});saveDay();render()}
const A={
  tab:v=>setTab(v),
  date:v=>{S.ui.sel=v==='today'?maxDate():clampD(addD(S.ui.sel,+v));S.ui.picker=false;render()},
  range:v=>{S.ui.range=v;render()},
  yn:v=>{const i=v.lastIndexOf(':'),path=v.slice(0,i),val=v.slice(i+1)==='1',d=day(S.ui.sel);setPath(d,path,getPath(d,path)===val?null:val);saveDay();render()},
  gymType:v=>{day(S.ui.sel).gym.type=v;saveDay();render()},
  picker:()=>{S.ui.picker=true;S.ui.pickEdit=false;render();$('picker')?.scrollIntoView({block:'nearest',behavior:'smooth'})},
  pickClose:()=>{S.ui.picker=false;S.ui.pickEdit=false;render()},
  pickEdit:()=>{S.ui.pickEdit=!S.ui.pickEdit;render()},
  addEx:v=>addExercise(v),
  addNewEx:()=>{const n=($('exNew')?.value||'').replace(/\s+/g,' ').trim();if(!n)return;const T=getDay(S.ui.sel).gym.type||'Push';
    const found=TYPES.map(X=>lib()[X].find(y=>y.toLowerCase()===n.toLowerCase())).find(Boolean);
    if(!found){S.lib=clone(lib());S.lib[T].push(n);saveLib()}addExercise(found||n)},
  libRm:v=>{const[T,i]=v.split(':');snapUndo();S.lib=clone(lib());const n=S.lib[T].splice(+i,1)[0];saveLib();render();toast(`Deleted ${n} from your list`,true)},
  rmEx:v=>{const d=day(S.ui.sel);snapUndo();const n=d.gym.ex.splice(+v,1)[0].name;saveDay();render();toast(`Removed ${n}`,true)},
  loadLast:()=>{const d=day(S.ui.sel),l=lastSession(d.gym.type,S.ui.sel);if(!l)return;d.gym.ex=l.ex.map(e=>({name:e.name,w:e.w,r:e.r}));saveDay();render();toast('Loaded. Update anything that changed.')},
  lift:v=>{S.ui.lift=v;render()},
  bente:v=>{const d=day(S.ui.sel);d.dutch.bente=(+d.dutch.bente||0)+(+v);saveDay();render()},
  addPod:()=>{const t=($('podNew')?.value||'').trim();if(!t)return;day(S.ui.sel).gen.pods.push(t);saveDay();render();$('podNew')?.focus()},
  rmPod:v=>{snapUndo();day(S.ui.sel).gen.pods.splice(+v,1);saveDay();render();toast('Removed podcast',true)},
  backup:()=>{const data=JSON.stringify({app:'winter-lock-in',v:2,saved:new Date().toISOString(),days:S.days,lib:S.lib});
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));a.download=`winter-lock-in-backup-${todayISO()}.json`;
    document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('Backup downloaded')},
  undo:()=>{if(!undo)return;undo();undo=null;$('toast-host').innerHTML='';render()}
};
function restoreFrom(el){const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!j||typeof j.days!=='object')throw 0;
      if(!confirm('Replace everything in the app with this backup?'))return;
      S.days={};for(const k in j.days)S.days[k]=norm(j.days[k],k);S.lib=j.lib||null;writeLocal();render();toast('Backup restored')}
    catch(err){toast('That file is not a Winter Lock In backup')}};
  r.readAsText(f);el.value=''}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset.v,el)}});
let rzT;addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(drawCharts,150)});

/* ---------- start ---------- */
loadLocal();
{const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))S.ui.tab=h}
S.ui.sel=maxDate();
render();
initCloud();
let lastDay=todayISO();
function dayCheck(){const t=todayISO();if(t===lastDay)return;const prevMax=lastDay<START?START:(lastDay>END?END:lastDay);lastDay=t;if(S.ui.sel===prevMax)S.ui.sel=maxDate();softRender()}
setInterval(dayCheck,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)dayCheck()});
if(!IN_CLAUDE&&'serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<!--ART-END-->
